<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Energy Monitor (ZMPT101B + ACS712)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#171923; --text:#e6e6e6; --muted:#9aa0a6; }
    body {
      font-family: system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0; padding: 24px;
    }
    h1 { margin: 0 0 12px; font-weight: 700; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .card {
      background: var(--card); border-radius: 16px; padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .label { font-size: 14px; color: var(--muted); }
    .value { font-size: 40px; font-weight: 700; margin-top: 6px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .status { margin-top: 8px; color: #5af28a; font-weight: 600; }
    .status.err { color: #ff7b7b; }
    canvas { width: 100%; height: 320px; }
    .footer { margin-top: 8px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <h1>🔌 Energy Monitor — ESP32 + ZMPT101B + ACS712</h1>
  <div class="row">
    <div class="card" style="flex:1 1 340px;">
      <div class="grid">
        <div>
          <div class="label">Vrms</div>
          <div class="value"><span id="vrms">0.00</span> V</div>
        </div>
        <div>
          <div class="label">Irms</div>
          <div class="value"><span id="irms">0.000</span> A</div>
        </div>
        <div>
          <div class="label">Apparent Power</div>
          <div class="value"><span id="apparent">0.0</span> VA</div>
        </div>
        <div>
          <div class="label">Frequency</div>
          <div class="value"><span id="freq">50.00</span> Hz</div>
        </div>
      </div>
      <div class="footer">Last update: <span id="ts">--:--:--</span></div>
      <div id="status" class="status">Đang chờ dữ liệu từ ESP32...</div>
    </div>
    <div class="card" style="flex:2 1 520px;">
      <div class="label">Lịch sử gần đây</div>
      <canvas id="chart"></canvas>
    </div>
  </div>

  <script>
    let chart;
    function initChart() {
      const ctx = document.getElementById('chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'Vrms (V)', data: [], yAxisID: 'y' },
            { label: 'Irms (A)', data: [], yAxisID: 'y1' },
            { label: 'S (VA)', data: [], yAxisID: 'y2' }
          ]
        },
        options: {
          responsive: true,
          animation: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { title: { display: true, text: 'Time (HH:MM:SS)' } },
            y: { position: 'left', title: { display: true, text: 'V' } },
            y1:{ position:'right', grid:{ drawOnChartArea:false }, title:{ display:true, text:'A' }},
            y2:{ position:'right', grid:{ drawOnChartArea:false }, display:false } // ẩn để gọn
          },
          plugins: {
            legend: { display: true }
          }
        }
      });
    }

    function refreshInstant() {
      $.getJSON('/get_measurement', (d) => {
        $('#vrms').text(d.vrms.toFixed(2));
        $('#irms').text(d.irms.toFixed(3));
        $('#apparent').text(d.apparent.toFixed(1));
        $('#freq').text(d.freq.toFixed(2));
        $('#ts').text(d.timestamp);
        $('#status').text('Đang nhận dữ liệu từ ESP32').removeClass('err');
      }).fail(() => {
        $('#status').text('Không kết nối được Flask/ESP32').addClass('err');
      });
    }

    function refreshHistory() {
      $.getJSON('/get_history', (arr) => {
        const labels = arr.map(p => p.t);
        const v = arr.map(p => p.vrms);
        const i = arr.map(p => p.irms);
        const s = arr.map(p => p.apparent);
        chart.data.labels = labels;
        chart.data.datasets[0].data = v;
        chart.data.datasets[1].data = i;
        chart.data.datasets[2].data = s;
        chart.update();
      });
    }

    initChart();
    refreshInstant();
    refreshHistory();
    setInterval(() => { refreshInstant(); refreshHistory(); }, 1000);
  </script>
</body>
</html>
